<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <h1>Sum of two numbers</h1>
    <input type="number" id="num1" placeholder="Enter first number"> <br><br>
    <input type="number" id="num2" placeholder="Enter second number"> <br><br>
    <button onclick="sum()">Add</button>
    <p id="result"></p>


    <script>
        function sum() {
            var number1 = parseFloat(document.getElementById('num1').value);
            var number2 = parseFloat(document.getElementById('num2').value);
            var result = number1 + number2;
            document.getElementById('result').innerHTML = "Sum : " + result;
        }
    </script>
</body>

</html>
